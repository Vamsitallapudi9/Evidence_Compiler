name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend (python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.14"]
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install
        run: |
          python -m venv backend/.venv
          backend/.venv/bin/python -m pip install --upgrade pip
          backend/.venv/bin/pip install -e "backend[dev]"
      - name: Lint
        run: backend/.venv/bin/ruff check backend eval data/demo && backend/.venv/bin/ruff format --check backend/src
      - name: Demo data + Postgres seed
        run: |
          backend/.venv/bin/python data/demo/generate.py
          backend/.venv/bin/python data/demo/seed_postgres.py "postgresql://postgres:postgres@localhost:5432/postgres"
      - name: Tests
        run: cd backend && .venv/bin/python -m pytest -q
      - name: Benchmark harness smoke test (offline, scripted model)
        run: PYTHONPATH=backend/src backend/.venv/bin/python -m eval.run --fake
      - name: Dependency audit
        run: |
          backend/.venv/bin/pip install pip-audit
          backend/.venv/bin/pip-audit --skip-editable

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npm audit --omit=dev --audit-level=high
        working-directory: frontend
