[project]
name = "evidence-compiler"
version = "0.1.0"
description = "Evidence-backed answers: claims compiled against primary source evidence."
requires-python = ">=3.12"
dependencies = [
  "anthropic>=1.11",
  "openai>=2.0",
  "duckdb>=1.5",
  "fastapi>=0.140",
  "openpyxl>=3.1",
  "pandas>=3.0",
  "pdfplumber>=0.11",
  "psycopg[binary]>=3.3",
  "pydantic>=2.13",
  "python-docx>=1.1",
  "python-dotenv>=1.2",
  "python-multipart>=0.0.30",
  "pyyaml>=6.0",
  "rank-bm25>=0.2.2",
  "reportlab>=5.0",
  "sqlglot>=30.0",
  "sqlmodel>=0.0.40",
  "sse-starlette>=3.5",
  "uvicorn[standard]>=0.50",
]

[project.optional-dependencies]
dev = ["pytest>=9.0", "ruff>=0.16", "httpx>=0.28"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", ".", ".."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["B008"]  # FastAPI dependency-injection idiom

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
