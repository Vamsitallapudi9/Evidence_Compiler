# Benchmark questions over the Halcyon Instruments demo corpus (data/demo/generate.py).
# Gold values come from data/demo/generated/ground_truth.json and are fixed by design.
#
# fact fields:
#   numbers       values that must appear in the answer (base units; "$7.4M" == 7400000)
#   keywords_all  case-insensitive substrings that must all appear
#   keywords_any  at least one must appear
#   sources       source files a correct citation for this fact may point to
#   derived       true if the fact requires computation over source values
# answerable: false → the correct behaviour is to say the evidence is insufficient.

